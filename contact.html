<div id="contactPage">
    
    <section aria-label="contact infortmation">
            <h1>Interested in Working Together?</h1>

         <form action="https://api.web3forms.com/submit" method="POST" title="Contact Form">
            <h2>Contact Me Directly</h2>

            <div class="contactFormName">
                <label for="name" id="name"> Name:</label>
                <input type="text" id="name" name="name" placeholder="Your Name" required>
            </div>

            <br>

            <div class="contactFormEmail">
                <label for="email" id="email" >Email:</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <br>

            <div class="contactFormMessage">
                <label for="message" id="message" required> Message:</label>
                <textarea id="message" name="message" placeholder="Type your message here!" required></textarea>
            </div>

            <br>
            <div class="contactFormSubmit">
                <button type="submit" id="submit"> Submit</button>
                <input type="hidden" name="apikey" value="6e93bba1-fc6c-4f3a-a204-f4b83da1afea">
            </div>

         </form>

    </section>
